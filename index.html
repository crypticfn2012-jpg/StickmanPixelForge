<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Stickman Showdown — a fast stickman fighter from PixelForge.">
  <title>Stickman Showdown — PixelForge</title>
  <link rel="icon" href="assets/images/pixelforge-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <main class="menu">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PixelForge home">
        <img src="assets/images/pixelforge-mark.svg" alt="">
        <span class="brand-name">PIXELFORGE<span class="brand-sub">INDEPENDENT GAME STUDIO</span></span>
      </a>
      <button class="account" id="accountButton" type="button" aria-label="CrazyGames account">
        <img class="avatar" id="accountAvatar" alt="" src="assets/images/pixelforge-mark.svg">
        <span class="account-name" id="accountName">Guest</span>
        <span class="account-action" id="accountAction">Sign in</span>
      </button>
    </header>
    <section class="showcase" aria-label="Stickman character showcase">
      <canvas id="fighter-showcase" tabindex="0" aria-label="Drag to rotate the stickman on the podium"></canvas>
      <div class="game-title">
        <div class="kicker">A PIXELFORGE ORIGINAL</div>
        <h1>STICKMAN<span>SHOWDOWN</span></h1>
        <p>Fast fights. Clean hits. One more round.</p>
      </div>
      <div class="spin-hint">DRAG TO ROTATE</div>
    </section>
    <div class="play-area">
      <button class="play-button" id="playButton" type="button"><span>PLAY NOW</span><span class="play-arrow" aria-hidden="true">↗</span></button>
    </div>
    <div class="version">PIXELFORGE · EARLY ACCESS BUILD</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="assets/js/crazygames.js"></script>
  <script src="assets/js/character.js"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
